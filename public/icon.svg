<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  
  <!-- Outer audio pulse ring -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
  <circle cx="256" cy="230" r="165" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>

  <!-- Microphone Icon -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Mic Capsule -->
    <rect x="216" y="140" width="80" height="150" rx="40"/>
    <!-- Mic Cradle -->
    <path d="M176 220 C176 275, 206 315, 256 315 C306 315, 336 275, 336 220" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
    <!-- Mic Stand -->
    <line x1="256" y1="315" x2="256" y2="380" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
    <line x1="200" y1="380" x2="312" y2="380" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>
